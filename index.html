<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bid Opportunities</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 antialiased">
  <a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-white focus:px-3 focus:py-2">Skip to content</a>

  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-4 md:flex-row md:items-center md:justify-between">
      <div class="flex items-center gap-3">
        <div class="grid h-9 w-9 place-items-center rounded-md bg-slate-900 text-white"><i data-lucide="landmark" class="h-5 w-5" aria-hidden="true"></i></div>
        <div>
          <h1 class="text-lg font-semibold leading-tight tracking-tight">Bid Opportunities</h1>
          <p class="text-xs text-slate-500">Government Procurement Dashboard</p>
        </div>
      </div>
      <div class="relative w-full md:max-w-sm">
        <label for="search" class="sr-only">Search</label>
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" aria-hidden="true"></i>
        <input id="search" type="search" autocomplete="off" placeholder="Search agencies or keywords..." class="w-full rounded-md border border-slate-300 bg-slate-50 py-2 pl-9 pr-3 text-sm transition focus:bg-white">
      </div>
    </div>
  </header>

  <div class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-2 px-4">
      <div role="tablist" aria-label="Sections" class="flex gap-1">
        <button role="tab" id="tab-agencies" data-tab="agencies" aria-controls="main" class="tab"></button>
        <button role="tab" id="tab-keywords" data-tab="keywords" aria-controls="main" class="tab"></button>
      </div>
      <div class="flex items-center gap-2 py-2" role="group" aria-label="Data management">
        <button id="btn-import" type="button" class="inline-flex items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 active:scale-[.98]"><i data-lucide="upload" class="h-4 w-4" aria-hidden="true"></i>Import JSON</button>
        <button id="btn-export" type="button" class="inline-flex items-center gap-1.5 rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50 active:scale-[.98]"><i data-lucide="download" class="h-4 w-4" aria-hidden="true"></i>Export JSON</button>
      </div>
    </div>
  </div>

  <main id="main" role="tabpanel" class="mx-auto w-full max-w-6xl flex-1 px-4 py-6"><div id="view"></div></main>

  <footer class="border-t border-slate-200 bg-white py-4 text-center text-xs text-slate-500">Built by John Paul Torres</footer>

  <div id="toasts" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2" aria-live="polite" aria-atomic="false"></div>

  <script src="js/app.js"></script>
</body>
</html>
